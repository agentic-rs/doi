name: Publish Paper Reader to Apell Store

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-doi-store
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.release.outputs.artifact-id }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.10.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3
      - name: Install Rust and native build dependencies
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev clang cmake
          cargo install --locked wasm-bindgen-cli --version 0.2.126
      - uses: agentic-rs/apell/actions/setup@actions-v1.0.0
        id: apell
      - name: Build and test Paper Reader
        env:
          APELL_BIN: ${{ steps.apell.outputs.binary }}
        run: |
          pnpm install --frozen-lockfile
          cargo fetch --locked --manifest-path crates/doi-ai/Cargo.toml
          pnpm test
          pnpm test:ai
      - name: Collect the tested bundle and publishing files
        run: |
          (cd artifacts && sha256sum --check doi.sha256)
          mkdir -p release
          cp artifacts/doi.apel artifacts/doi.sha256 assets/icon.png publish.json release/
      - name: Retain release files
        id: release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doi-store-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download this run's tested bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release
          digest-mismatch: error
      - name: Verify the package checksum
        working-directory: release
        run: sha256sum --check doi.sha256
      - uses: agentic-rs/apell/actions/publish@actions-v1.0.0
        with:
          store_url: ${{ vars.APELL_STORE_URL }}
          package: release/doi.apel
          metadata: release/publish.json
          icon: release/icon.png
