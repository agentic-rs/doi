[package]
name = "papertrail"
version = "0.1.0"
description = "A local paper reader with anchored annotations"
edition = "2021"
rust-version = "1.90"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "papertrail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream"] }
tokn-core = { git = "https://github.com/tokn-ai/tokn", rev = "4db3eedb869604b460980956ad42152daaa23ad1" }
tokn-headers = { git = "https://github.com/tokn-ai/tokn", rev = "4db3eedb869604b460980956ad42152daaa23ad1" }
tokn-provider-openai = { git = "https://github.com/tokn-ai/tokn", rev = "4db3eedb869604b460980956ad42152daaa23ad1" }
tokn-provider-deepseek = { git = "https://github.com/tokn-ai/tokn", rev = "4db3eedb869604b460980956ad42152daaa23ad1" }
tokn-provider-zai = { git = "https://github.com/tokn-ai/tokn", rev = "4db3eedb869604b460980956ad42152daaa23ad1" }
tokn-provider-llama-cpp = { git = "https://github.com/tokn-ai/tokn", rev = "4db3eedb869604b460980956ad42152daaa23ad1" }
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = { version = "0.41", features = ["serialize"] }
sha2 = "0.10"
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
keyring = "4.2"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }
keyring-core = "1"
tauri-plugin-papertrail-export = { path = "plugins/tauri-plugin-papertrail-export" }
tauri-plugin-papertrail-reader = { path = "plugins/tauri-plugin-papertrail-reader" }

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
tokio-rustls = "0.26"
