[package]
name = "tauri-plugin-papertrail-export"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
links = "tauri-plugin-papertrail-export"
description = "Export complete Papertrail annotation files through the iOS document picker"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = "2"
